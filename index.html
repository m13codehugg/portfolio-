<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1020">
  <meta name="description" content="Portfolio professionnel de Guirel Massana, élève en Première Bac Pro CIEL.">
  <title>Guirel Massana — Portfolio CIEL</title>

  <style>
    :root {
      --bg: #080d19;
      --surface: #111a2d;
      --surface2: #17233a;
      --text: #f4f7ff;
      --muted: #a7b3c9;
      --accent: #65a7ff;
      --accent2: #8b7cff;
      --border: rgba(255,255,255,.10);
      --radius: 18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.65;
    }

    a { color: inherit; text-decoration: none; }

    button, input { font: inherit; }

    .container {
      width: min(1120px, 90%);
      margin: auto;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(8,13,25,.92);
      backdrop-filter: blur(15px);
      border-bottom: 1px solid var(--border);
    }

    .navbar {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -.5px;
    }

    .logo span { color: var(--accent); }

    nav {
      display: flex;
      align-items: center;
      gap: 25px;
    }

    nav a {
      color: var(--muted);
      font-size: 14px;
      transition: .2s;
    }

    nav a:hover { color: white; }

    .menu-button {
      display: none;
      border: 1px solid var(--border);
      background: var(--surface);
      color: white;
      border-radius: 9px;
      padding: 8px 12px;
      cursor: pointer;
    }

    .hero {
      min-height: 590px;
      display: flex;
      align-items: center;
      padding: 90px 0;
      background:
        radial-gradient(circle at 80% 20%, rgba(101,167,255,.19), transparent 35%),
        radial-gradient(circle at 10% 80%, rgba(139,124,255,.12), transparent 35%);
    }

    .hero-content { max-width: 800px; }

    .eyebrow {
      display: inline-block;
      color: #b9d8ff;
      background: rgba(101,167,255,.12);
      border: 1px solid rgba(101,167,255,.25);
      border-radius: 30px;
      padding: 7px 14px;
      font-size: 13px;
      margin-bottom: 25px;
    }

    h1 {
      font-size: clamp(42px, 7vw, 76px);
      line-height: 1.08;
      letter-spacing: -2px;
      margin-bottom: 22px;
    }

    h1 span {
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      color: transparent;
    }

    .hero p {
      color: var(--muted);
      max-width: 650px;
      font-size: 18px;
      margin-bottom: 30px;
    }

    .button {
      display: inline-block;
      background: linear-gradient(110deg, #3989ed, #7668e9);
      color: white;
      border: 0;
      padding: 13px 21px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      transition: .2s;
    }

    .button:hover { transform: translateY(-2px); }

    .button-secondary {
      background: transparent;
      border: 1px solid var(--border);
      margin-left: 10px;
    }

    section { padding: 85px 0; }

    .section-title {
      font-size: clamp(28px, 4vw, 39px);
      margin-bottom: 12px;
      letter-spacing: -.8px;
    }

    .section-description {
      color: var(--muted);
      max-width: 690px;
      margin-bottom: 38px;
    }

    .about-grid {
      display: grid;
      grid-template-columns: 1.3fr .7fr;
      gap: 25px;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 27px;
    }

    .panel p { color: var(--muted); }

    .profile-card {
      background: linear-gradient(145deg, #182b49, #111a2d);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      min-height: 230px;
    }

    .profile-symbol {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #3989ed, #7668e9);
      font-size: 34px;
      font-weight: 800;
      margin-bottom: 18px;
    }

    .profile-card p { font-size: 14px; }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .skill-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      transition: .2s;
    }

    .skill-card:hover {
      transform: translateY(-4px);
      border-color: rgba(101,167,255,.5);
    }

    .skill-icon {
      font-size: 27px;
      margin-bottom: 13px;
    }

    .skill-card h3 { margin-bottom: 10px; }

    .skill-card p {
      color: var(--muted);
      font-size: 14px;
    }

    .dark-section {
      background: #0d1424;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    .timeline {
      border-left: 2px solid #3d73b7;
      margin-left: 9px;
      padding-left: 28px;
    }

    .timeline-item {
      position: relative;
      margin-bottom: 32px;
    }

    .timeline-item::before {
      content: "";
      position: absolute;
      left: -37px;
      top: 8px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 15px rgba(101,167,255,.5);
    }

    .timeline-item h3 { margin-bottom: 5px; }

    .timeline-date {
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 9px;
    }

    .timeline-item p,
    .timeline-item li {
      color: var(--muted);
      font-size: 14px;
    }

    .timeline-item ul {
      padding-left: 20px;
      margin-top: 10px;
    }

    .education-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .education-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 25px;
    }

    .education-card .year {
      color: var(--accent);
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .education-card p {
      color: var(--muted);
      font-size: 14px;
      margin-top: 8px;
    }

    .qualities {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 20px;
    }

    .tag {
      padding: 9px 15px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 30px;
      color: #dce8ff;
      font-size: 13px;
    }

    .languages {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-top: 25px;
    }

    .language {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 18px;
      border-radius: 13px;
    }

    .language p {
      color: var(--muted);
      font-size: 13px;
    }

    .contact-panel {
      text-align: center;
      background: linear-gradient(130deg, #172b49, #171c39);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 45px 25px;
    }

    .contact-panel p {
      color: var(--muted);
      margin-top: 12px;
    }

    footer {
      padding: 30px 0;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    /* --- SECTION CONFIGURATION DU CHATBOT (BOT.NZZZZZZI*) --- */

    .chat-launcher {
      position: fixed;
      right: 23px;
      bottom: 23px;
      z-index: 1000;
      width: 60px;
      height: 60px;
      border: 0;
      border-radius: 50%;
      background: linear-gradient(135deg, #3989ed, #7668e9);
      color: white;
      cursor: pointer;
      box-shadow: 0 8px 30px rgba(0,0,0,.4);
      display: grid;
      place-items: center;
      transition: .2s;
    }

    .chat-launcher:hover { transform: scale(1.07); }

    .chat-box {
      position: fixed;
      right: 23px;
      bottom: 95px;
      z-index: 1000;
      width: 380px;
      height: 520px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 12px 40px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transform: translateY(20px);
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .chat-box.active {
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    .chat-header {
      background: var(--surface2);
      padding: 15px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .chat-bot-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .chat-avatar {
      width: 35px;
      height: 35px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-weight: bold;
      font-size: 14px;
    }

    .chat-status-container h4 {
      font-size: 14px;
      font-weight: 700;
    }

    .chat-menu-select {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }

    .chat-messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 13px;
